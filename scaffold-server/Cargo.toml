[package]
name = "scaffold-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tower-http = "0.6"
scaffold-graph = { path = "../scaffold-graph" }
scaffold-ai = { path = "../scaffold-ai" }
sqlx = { version = "0.7", features = ["runtime-tokio", "tls-rustls", "sqlite", "macros", "chrono"] }
tokio = { version = "1.38", features = ["full"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
futures-util = "0.3"
chrono = "0.4"
anyhow = "1.0"
loro = "1.0.0"

[dev-dependencies]
tokio-tungstenite = "0.24"
tower = { version = "0.5", features = ["util"] }
