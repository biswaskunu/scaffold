<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scaffold · Shared canvas</title>
  </head>
  <body>
    <main>
      <header>
        <div><p class="eyebrow">SCAFFOLD / M1 SYNC</p><h1>Shared canvas</h1></div>
        <div id="connection" class="connection"><span></span>Connecting</div>
      </header>
      <section class="toolbar">
        <label>Room <input id="room" value="demo-room" /></label>
        <button id="connect">Connect</button>
        <button id="add" class="primary">＋ Add node</button>
        <p>Drag cards to move them. Open another tab to try live sync.</p>
      </section>
      <section id="canvas" class="canvas" aria-label="Canvas"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
